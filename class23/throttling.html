<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throttling</title>
    <style>
        body,html{
            height: 3000px;
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .status{
            position : fixed;
            top: 0px;
            left:0px;
            background-color: rgba(0,0,0,0.7);
            color:white;
            padding: 10px;
        }
    </style>
</head>
<body>
   <div class="status">
    Scroll position: <span id="scrollPositon">0</span>
   </div>
   <script>
    window.addEventListener('scroll', throttling(updateScrollPosition , 500));
        // document.getElementById('scrollPositon').innerText = window.scrollY;
        // console.log('Scrolled')

        function updateScrollPosition(){
           const scrollPositon = window.scrollY;
           document.getElementById('scrollPositon').innerText = scrollPositon;
        }
        function throttling(func, limit){
            let inThrottle; // flag
            return function(){
                if(!inThrottle){
                    func();
                    inThrottle = true; // update inthrottle


                    //after limit again false 
                    setTimeout(function(){
                        inThrottle = false;
                    }, limit);
                }
            }
        }
   </script>
</body>
</html>
